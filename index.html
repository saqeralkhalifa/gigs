<script>
/* MCLANG: one language resolver shared across Dr. Saqer AlKhalifa's tools. */
function mcInitLang(){
  try{
    var q = (location.search.match(/[?&]lang=(ar|en)\b/) || [])[1];
    if(q) return q;
    var s = window.localStorage && localStorage.getItem("mc-lang");
    if(s === "ar" || s === "en") return s;
    var n = (navigator.languages && navigator.languages[0]) || navigator.language || "";
    if(/^ar/i.test(n)) return "ar";
  }catch(e){}
  return "en";
}
function mcSaveLang(v){ try{ localStorage.setItem("mc-lang", v); }catch(e){} }
</script>

:root{

  --font-body:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;

  --ink-3:#6b6e74;

  --navy:#14161a;
  --navy-deep:#8a5a1e;
  --accent:#8a5a1e;
  --accent-soft:#efece4;
  --accent-line:#cfc9bd;

  --gold:#8a5a1e;

  --bad:#8c3a30;   --bad-soft:#f4e9e5;   --bad-line:#e2cfc8;

  --radius:0; --radius-sm:0;
  --shadow:none; --shadow-lift:none;
}

.oh b{font-family:var(--font-display); font-weight:400; font-size:1.35rem; line-height:1.35;
  color:var(--ink); flex:1; min-width:200px;}
[dir="rtl"] .oh b{font-family:var(--font-ar); font-weight:600;}
.org{font-size:.98rem; color:var(--ink-2); margin-bottom:10px;}
.tag{font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; font-weight:700;
  padding:4px 9px; border:1px solid var(--line-2); color:var(--ink-3); white-space:nowrap;}
[dir="rtl"] .tag{letter-spacing:0; font-size:.82rem;}
.tag.pay{color:var(--good); border-color:var(--good-line); background:var(--good-soft);}
.tag.done{color:var(--bad); border-color:var(--bad-line); background:var(--bad-soft);}
.opp p.desc{font-size:.99rem; line-height:1.85; color:var(--body); margin-top:4px;}
.meta{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px; padding-top:12px;
  border-top:1px dashed var(--line);}
@media(max-width:640px){ .meta{grid-template-columns:1fr;} }
.meta div{font-size:.92rem; color:var(--ink-2); line-height:1.7;}
.ml{display:block; font-size:.7rem; letter-spacing:.14em; text-transform:uppercase;
  color:var(--accent); font-weight:700; margin-bottom:3px;}
[dir="rtl"] .ml{letter-spacing:0; font-size:.8rem;}
.checked{margin-top:10px; font-size:.85rem; color:var(--ink-3);}

.crossbox{margin-top:46px; padding:26px; background:var(--card); border:1px solid var(--line);}
.crossbox h2{font-size:1.3rem; margin-bottom:6px;}
.crossbox p.sub{font-size:.94rem; color:var(--ink-3); margin-bottom:16px;}
.crossgrid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
@media(max-width:760px){ .crossgrid{grid-template-columns:1fr;} }
.crosscard{display:block; border:1px solid var(--line); padding:16px 18px; text-decoration:none;
  background:var(--paper);}
.crosscard:hover{border-color:var(--accent);}
.crosscard b{display:block; color:var(--ink); font-size:1rem; margin-bottom:4px;}
.crosscard span{font-size:.88rem; color:var(--ink-3); line-height:1.6; display:block;}

.srcbox{margin-top:40px; padding:22px 24px; background:var(--card); border:1px solid var(--line);}
.srcbox h2{font-size:1.05rem; margin-bottom:6px;}
.srcbox p{font-size:.92rem; color:var(--ink-2); line-height:1.8;}
footer.site{margin-top:38px; padding-top:20px; border-top:1px solid var(--line);

let LANG = "en", TY = "all", SE = "all";

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function applyHref(o){
  var subj = (LANG==="en" ? "Application: " : "طلب تقديم: ") + o.role[LANG] +
             (o.org ? (LANG==="en" ? " at " : " لدى ") + o.org[LANG] : "") + " [" + o.id + "]";
  var body = LANG==="en"
    ? "Hello Dr. Saqer,\n\nI would like to apply for this opportunity.\n\nName: \nPhone: \nArea of residence: \nAvailability: \nRelevant experience: \n\nMy CV is attached.\n"
    : "مرحبًا د. صقر،\n\nأرغب في التقدم لهذه الفرصة.\n\nالاسم: \nالهاتف: \nمنطقة السكن: \nأوقات التفرغ: \nالخبرة ذات الصلة: \n\nسيرتي الذاتية مرفقة.\n";
  return "mailto:alkhalifa.sager@gmail.com?subject=" + encodeURIComponent(subj) + "&body=" + encodeURIComponent(body);
}

function card(o){
  var t = T[LANG];
  var ty = TYPES.filter(function(x){return x.k===o.ty;})[0];
  var out = '<div class="opp'+(o.status==="filled"?" filled":"")+'" id="'+o.id+'">';
  out += '<div class="oh"><b>'+esc(o.role[LANG])+'</b>';
  if(ty) out += '<span class="tag">'+ty[LANG]+'</span>';
  out += o.pay ? '<span class="tag pay">'+esc(o.pay[LANG])+'</span>'
               : '<span class="tag">'+t.payAsk+'</span>';
  if(o.status==="filled") out += '<span class="tag done">'+t.filled+'</span>';
  out += '</div>';
  if(o.org) out += '<div class="org">'+esc(o.org[LANG])+'</div>';
  if(o.desc) out += '<p class="desc">'+esc(o.desc[LANG])+'</p>';
  out += '<div class="meta">';
  if(o.pay)  out += '<div><span class="ml">'+t.dPay+'</span>'+esc(o.pay[LANG])+'</div>';
  if(o.time) out += '<div><span class="ml">'+t.dTime+'</span>'+esc(o.time[LANG])+'</div>';
  if(o.loc)  out += '<div><span class="ml">'+t.dLoc+'</span>'+esc(o.loc[LANG])+'</div>';
  if(o.dead) out += '<div><span class="ml">'+t.dDead+'</span>'+esc(o.dead[LANG])+'</div>';
  out += '</div>';
  if(o.status!=="filled"){
    out += '<div class="applyrow">';
    out += '<a class="btn apply mail" href="'+applyHref(o)+'">'+t.applyUs+'</a>';
    if(o.url) out += '<a class="olink" href="'+o.url+'" target="_blank" rel="noopener">'+t.more+'</a>';
    out += '</div>';
  }
  if(o.checked) out += '<div class="checked">'+t.checked(o.checked)+'</div>';
  out += '</div>';
  return out;
}

function chips(el, list, cur, attr){
  el.innerHTML = list.map(function(x){
    return '<button class="chip'+(x.k===cur?" on":"")+'" '+attr+'="'+x.k+'">'+x[LANG]+'</button>';
  }).join("");
}

function render(){
  var t = T[LANG];
  ["kicker","title","sub"].forEach(function(k){ document.getElementById("t-"+k).textContent = t[k]; });
  document.getElementById("h-h").textContent = t.hH;
  document.getElementById("h-1").textContent = t.h1;
  document.getElementById("h-2").textContent = t.h2;
  document.getElementById("h-3").textContent = t.h3;
  document.getElementById("p-h").textContent = t.pH;
  document.getElementById("p-p").textContent = t.pP;
  document.getElementById("p-btn").textContent = t.pBtn;
  document.getElementById("p-or").textContent = t.pOr;
  document.getElementById("p-mail").textContent = t.pMail;
  document.getElementById("s-h").textContent = t.sH;
  document.getElementById("s-p").textContent = t.sP;
  document.getElementById("s-btn").textContent = t.sBtn;
  document.getElementById("s-cv").textContent = t.sCv;
  document.getElementById("t-tylabel").textContent = t.tyLabel;
  document.getElementById("t-selabel").textContent = t.seLabel;
  document.getElementById("f-h").textContent = t.fH;
  document.getElementById("f-p").textContent = t.fP;
  document.getElementById("x-h").textContent = t.xH;
  document.getElementById("x-p").textContent = t.xP;
  document.getElementById("xgrid").innerHTML = t.xCards.map(function(c){
    return '<a class="crosscard" href="'+c[0]+'"><b>'+c[1]+'</b><span>'+c[2]+'</span></a>';
  }).join("");
  document.getElementById("d-h").textContent = t.dH;
  document.getElementById("d-p").textContent = t.dP;
  document.getElementById("t-foot").textContent = t.foot;

  chips(document.getElementById("tychips"), TYPES, TY, "data-ty");
  chips(document.getElementById("sechips"), SECTORS, SE, "data-se");

  var open = GIGS.filter(function(o){ return (TY==="all"||o.ty===TY) && (SE==="all"||o.se===SE); });
  var list = document.getElementById("gigs");
  var found = document.getElementById("found");
  var count = document.getElementById("count");
  if(GIGS.length === 0){
    list.innerHTML = "";
    count.textContent = "";
    found.hidden = false;
  }else{
    found.hidden = true;
    count.textContent = open.length ? t.count(open.length, GIGS.length) : t.none;
    list.innerHTML = open.map(card).join("");
  }
}

function gc(path, title){
  if(window.goatcounter && window.goatcounter.count){
    try{ window.goatcounter.count({path:path, title:title, event:true}); }catch(e){}
  }
}

document.addEventListener("click", function(e){
  var c = e.target.closest ? e.target.closest(".chip") : null;
  if(c){
    if(c.hasAttribute("data-ty")){ TY = c.getAttribute("data-ty"); gc("gg-ty-"+TY, "Type "+TY); }
    else if(c.hasAttribute("data-se")){ SE = c.getAttribute("data-se"); gc("gg-se-"+SE, "Sector "+SE); }
    render();
    return;
  }
  if(!e.target.closest) return;
  if(e.target.closest("#p-btn")) gc("gg-post", "Company form opened");
  if(e.target.closest("#p-mail")) gc("gg-post-mail", "Company mailto opened");
  if(e.target.closest("#s-btn")) gc("gg-seek", "Seeker form opened");
  if(e.target.closest("#s-cv")) gc("gg-cv", "CV builder opened");
  if(e.target.closest(".btn.apply.mail") && e.target.closest(".opp")) gc("gg-apply", "Application email opened");
  if(e.target.closest(".olink")) gc("gg-out", "Outbound to employer");
  if(e.target.closest(".crosscard")) gc("gg-cross", "Across to family site");
});

document.getElementById("langToggle").addEventListener("click", function(){
  LANG = (LANG === "en") ? "ar" : "en";
  document.documentElement.lang = LANG;
  document.documentElement.dir = (LANG === "ar") ? "rtl" : "ltr";
  this.textContent = (LANG === "ar") ? "English" : "عربي";
  render();
});

/* deep links: ?ty= and ?se= */
try{
  var q = new URLSearchParams(location.search);
  var _t = q.get("ty"); if(_t && TYPES.some(function(x){return x.k===_t;})) TY = _t;
  var _s = q.get("se"); if(_s && SECTORS.some(function(x){return x.k===_s;})) SE = _s;
}catch(e){}

render();
</script>

    var l = document.documentElement.lang === "ar" ? "ar" : "en";
    var n = document.querySelectorAll("[data-en]");
    for(var i=0;i<n.length;i++){
      n[i].textContent = n[i].getAttribute("data-"+l);
      var h = n[i].getAttribute("data-href-"+l);
      if(h) n[i].setAttribute("href", h);
    }
  }
  try{ new MutationObserver(sync).observe(document.documentElement,{attributes:true,attributeFilter:["lang"]}); }catch(e){}
  document.addEventListener("click", function(e){ if(e.target && e.target.id === "langToggle") setTimeout(sync, 0); }, true);
  sync();
})();
</script>
<script>
(function(){
  var b = document.getElementById("langToggle");
  if(!b) return;
  if(mcInitLang() === "ar" && document.documentElement.lang !== "ar") b.click();
  document.addEventListener("click", function(e){
    if(e.target && e.target.id === "langToggle"){
      setTimeout(function(){ mcSaveLang(document.documentElement.lang === "ar" ? "ar" : "en"); }, 0);
    }
  }, true);
})();
</script>
</body>
</html>
